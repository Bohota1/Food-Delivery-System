<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Delivery System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" data-go="home">
      Food <em>Delivery</em>
      <small>System</small>
    </div>
    <nav>
      <button data-go="home" class="on">Restaurants</button>
      <button data-go="orders">My orders</button>
      <button data-go="rider">Rider</button>
      <button data-go="admin">Admin</button>
    </nav>
    <div class="grow"></div>
    <span class="who" id="who"></span>
    <button class="icon-btn" id="cart-btn">
      Cart <span class="badge hidden" id="cart-count">0</span>
    </button>
    <button class="icon-btn" id="auth-btn">Sign in</button>
  </div>
</header>

<main id="app"></main>

<footer>
  Food Delivery System — Spring Boot microservices · API Gateway :8080 · Eureka :8761 · RabbitMQ
  &nbsp;·&nbsp; <a href="console.html">Developer API console</a>
</footer>

<div id="cart-layer"></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
