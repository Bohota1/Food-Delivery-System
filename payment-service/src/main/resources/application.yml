server:
  port: 9004

spring:
  application:
    name: PAYMENT-SERVICE

  # Database-per-service: Payment Service owns payment_db on the shared
  # FoodDeliveryCluster. The Atlas connection string lives in
  # application.properties (gitignored) - see application.properties.example.

  rabbitmq:
    addresses: localhost:5672

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

# Simulated payment gateway. Lower max-amount below the order total to
# demonstrate the FAILED path live, then raise it again for the happy path.
payment:
  gateway:
    max-amount: 100000
